<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Electronics POS{% endblock %}</title>
    <style>
      @media only screen and (max-width: 600px) {
        .email-shell { width: 100% !important; }
        .email-content { padding: 24px 20px !important; }
      }
    </style>
  </head>
  <body style="margin:0;padding:24px 12px;background:#f1f5f9;font-family:Arial,Helvetica,sans-serif;color:#111827;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">
      {% block preheader %}Electronics POS account notification{% endblock %}
    </div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
      <tr>
        <td align="center">
          <table role="presentation" class="email-shell" width="600" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:600px;border:1px solid #dbe2ea;border-radius:14px;overflow:hidden;background:#ffffff;">
            <tr>
              <td align="center" style="padding:18px 20px;background:#192752;color:#ffffff;">
                <div style="font-size:23px;font-weight:700;letter-spacing:.2px;">ELECTRONICS POS</div>
                <div style="padding-top:5px;font-size:11px;letter-spacing:.7px;color:#dbeafe;">POINT OF SALE MANAGEMENT SYSTEM</div>
              </td>
            </tr>
            <tr>
              <td class="email-content" style="padding:28px 30px 24px;">
                {% block content %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:16px;background:#f1f5f9;color:#64748b;font-size:12px;line-height:1.7;">
                <strong style="color:#334155;">Electronics POS</strong><br>
                Automated system notification. Please do not reply.<br>
                &copy; {% now "Y" %} Electronics POS. All rights reserved.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
